name: Build A047F ReSukiSU Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl wget bc bison flex build-essential \
            zip unzip cpio kmod openssl libssl-dev libelf-dev \
            pahole libncurses-dev libtinfo5 device-tree-compiler \
            lz4 xz-utils zstd rsync python3 python-is-python3 \
            p7zip-full android-sdk-libsparse-utils erofs-utils \
            libarchive-tools libxml2-utils xsltproc tofrodos

      - name: Initialize submodules
        run: |
          set -e
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Prepare toolchains
        run: |
          set -e
          mkdir -p "$HOME/toolchains"

      - name: Download Clang
        run: |
          set -e

          CLANG="$HOME/toolchains/clang-r353983c"

          if [ ! -x "$CLANG/bin/clang" ]; then
            mkdir -p "$CLANG"
            cd "$CLANG"

            for i in 1 2 3 4 5; do
              echo "Downloading Clang attempt $i..."

              if curl -fL --retry 5 --retry-delay 5 \
                --connect-timeout 30 \
                --max-time 1800 \
                -o clang.tar.gz \
                "https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r353983c.tar.gz"; then
                break
              fi

              if [ "$i" = "5" ]; then
                echo "ERROR: Failed to download Clang"
                exit 1
              fi

              sleep 10
            done

            tar -xf clang.tar.gz
            rm -f clang.tar.gz
          fi

          "$CLANG/bin/clang" --version

      - name: Download ARM GNU toolchain
        run: |
          set -e

          GCC_DIR="$HOME/toolchains/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu"

          if [ ! -x "$GCC_DIR/bin/aarch64-none-linux-gnu-gcc" ]; then
            mkdir -p "$HOME/toolchains/gcc"
            cd "$HOME/toolchains/gcc"

            for i in 1 2 3 4 5; do
              echo "Downloading ARM GNU toolchain attempt $i..."

              if curl -fL --retry 5 --retry-delay 5 \
                --connect-timeout 30 \
                --max-time 1800 \
                -o arm-gnu-toolchain.tar.xz \
                "https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz"; then
                break
              fi

              if [ "$i" = "5" ]; then
                echo "ERROR: Failed to download ARM GNU toolchain"
                exit 1
              fi

              sleep 10
            done

            tar -xf arm-gnu-toolchain.tar.xz
            rm -f arm-gnu-toolchain.tar.xz
          fi

          "$GCC_DIR/bin/aarch64-none-linux-gnu-gcc" --version

      - name: Configure build environment
        run: |
          echo "KERNEL_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "ARCH=arm64" >> "$GITHUB_ENV"
          echo "PLATFORM_VERSION=12" >> "$GITHUB_ENV"
          echo "ANDROID_MAJOR_VERSION=s" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_USER=HG" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_HOST=GitHub-Actions" >> "$GITHUB_ENV"

          echo "$HOME/toolchains/clang-r353983c/bin" >> "$GITHUB_PATH"
          echo "$HOME/toolchains/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin" >> "$GITHUB_PATH"

      - name: Prepare output directories
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/out"
          mkdir -p "$GITHUB_WORKSPACE/build"

      - name: Sync latest ReSukiSU
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          rm -rf KernelSU

          for i in 1 2 3 4 5; do
            echo "Cloning ReSukiSU attempt $i..."

            if git clone \
              --depth=1 \
              --single-branch \
              https://github.com/ReSukiSU/ReSukiSU.git \
              KernelSU; then
              break
            fi

            rm -rf KernelSU

            if [ "$i" = "5" ]; then
              echo "ERROR: Cannot clone ReSukiSU upstream"
              exit 1
            fi

            sleep 15
          done

          test -f KernelSU/kernel/setup.sh

          chmod +x KernelSU/kernel/setup.sh

          cd "$GITHUB_WORKSPACE/KernelSU"
          git log -1 --oneline

          cd "$GITHUB_WORKSPACE"

          ./KernelSU/kernel/setup.sh

      - name: Prepare A047F defconfig
        run: |
          set -e

          CONFIG_DIR="$GITHUB_WORKSPACE/arch/arm64/configs"

          echo "Available A047F configs:"
          ls -la "$CONFIG_DIR" | grep -Ei "a04|a047|exynos850|lesdieuxx|hg" || true

          if [ -f "$CONFIG_DIR/lesdieuxx.config" ]; then
            cp "$CONFIG_DIR/lesdieuxx.config" \
               "$CONFIG_DIR/hg_a047f.config"
          fi

          if [ ! -f "$CONFIG_DIR/hg_a047f.config" ]; then
            echo "ERROR: hg_a047f.config not found"
            exit 1
          fi

          if [ ! -f "$CONFIG_DIR/exynos850-a04sxx_defconfig" ]; then
            echo "ERROR: exynos850-a04sxx_defconfig not found"
            exit 1
          fi

          rm -f "$CONFIG_DIR/merged_defconfig"

          KCONFIG_CONFIG="$CONFIG_DIR/merged_defconfig" \
          ./scripts/kconfig/merge_config.sh -m \
            "$CONFIG_DIR/exynos850-a04sxx_defconfig" \
            "$CONFIG_DIR/hg_a047f.config"

          test -f "$CONFIG_DIR/merged_defconfig"

          echo "Merged defconfig:"
          ls -lh "$CONFIG_DIR/merged_defconfig"

      - name: Generate kernel configuration
        run: |
          set -e

          make \
            -C "$GITHUB_WORKSPACE" \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            CROSS_COMPILE="$HOME/toolchains/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-" \
            CC="$HOME/toolchains/clang-r353983c/bin/clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            merged_defconfig

          test -f "$GITHUB_WORKSPACE/out/.config"

      - name: Check kernel configuration
        run: |
          set -e

          echo "KernelSU configuration:"
          grep -E "CONFIG_KSU|CONFIG_KSU_SUSFS" \
            "$GITHUB_WORKSPACE/out/.config" || true

          echo "ARM64 configuration:"
          grep -E "CONFIG_ARM64=" \
            "$GITHUB_WORKSPACE/out/.config" || true

      - name: Build kernel Image
        run: |
          set -e

          make \
            -C "$GITHUB_WORKSPACE" \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            CROSS_COMPILE="$HOME/toolchains/gcc/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-" \
            CC="$HOME/toolchains/clang-r353983c/bin/clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            -j"$(nproc)" \
            Image

      - name: Verify kernel Image
        run: |
          set -e

          IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image"

          if [ ! -f "$IMAGE" ]; then
            echo "ERROR: Kernel Image not found"
            exit 1
          fi

          ls -lh "$IMAGE"
          file "$IMAGE"

      - name: Upload kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: A047F-ReSukiSU-Image
          path: out/arch/arm64/boot/Image
          if-no-files-found: error

      - name: Clone AnyKernel3
        run: |
          set -e

          rm -rf AnyKernel3

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3

          rm -rf AnyKernel3/.git

      - name: Configure AnyKernel3
        run: |
          set -e

          AK="$GITHUB_WORKSPACE/AnyKernel3/anykernel.sh"

          cat > "$AK" <<'AKSCRIPT'
          properties() {
          kernel.string=HG ReSukiSU Kernel | Samsung A04s A047F
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=a04s
          device.name2=A047F
          device.name3=SM-A047F
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          }

          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          ui_print " ";
          ui_print "================================";
          ui_print " HG ReSukiSU Kernel";
          ui_print " Samsung Galaxy A04s";
          ui_print " SM-A047F";
          ui_print "================================";
          ui_print " ";

          dump_boot;
          write_boot;
          AKSCRIPT

          chmod +x "$AK"

      - name: Copy Image to AnyKernel3
        run: |
          set -e

          cp \
            "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image" \
            "$GITHUB_WORKSPACE/AnyKernel3/Image"

          test -f "$GITHUB_WORKSPACE/AnyKernel3/Image"

      - name: Verify AnyKernel3
        run: |
          set -e

          AK="$GITHUB_WORKSPACE/AnyKernel3/anykernel.sh"

          grep -q "device.name1=a04s" "$AK"
          grep -q "device.name2=A047F" "$AK"
          grep -q "device.name3=SM-A047F" "$AK"

          test -f "$GITHUB_WORKSPACE/AnyKernel3/Image"

          echo "A047F AnyKernel3 verification: PASS"

      - name: Pack flashable ZIP
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/AnyKernel3"

          ZIP_NAME="HG-A047F-ReSukiSU-$(date +%Y%m%d-%H%M).zip"

          zip -r9 \
            "$GITHUB_WORKSPACE/build/$ZIP_NAME" \
            . \
            -x "*.git*" \
            -x "*.zip"

          ls -lh "$GITHUB_WORKSPACE/build/$ZIP_NAME"

      - name: Upload flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: HG-A047F-ReSukiSU-AnyKernel3
          path: build/*.zip
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A047F-build-logs
          path: |
            out/.config
            out/.config.old
            arch/arm64/configs/merged_defconfig
            arch/arm64/configs/hg_a047f.config
          if-no-files-found: ignore
